name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  yocto-tools:
    name: Pi hardware profiles and update safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install device-tree and isolated updater test tools
        run: sudo apt-get update && sudo apt-get install --yes device-tree-compiler bubblewrap apparmor
      - name: Allow Bubblewrap user namespaces on the CI runner
        run: sudo apparmor_parser --replace --skip-cache .github/ci/bwrap.apparmor
      - name: Verify unprivileged installer sandbox
        run: |
          id
          test "$(id -u)" -ne 0
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns
          # Evaluate the IDs inside the sandbox, not on the host.
          # shellcheck disable=SC2016
          timeout 10 bwrap \
            --ro-bind / / \
            --unshare-user --uid 0 --gid 0 --unshare-pid --unshare-net \
            --proc /proc --dev /dev --tmpfs /run --chdir / \
            -- /bin/sh -ec 'test "$(id -u)" -eq 0; test "$(id -g)" -eq 0'
      - run: npm --prefix yocto test
        env:
          SPACEWARS_REQUIRE_UPDATE_SANDBOX: 1
      - run: shellcheck benchmark-clock.sh update.sh yocto/meta-spacewars/recipes-spacewars/spacewars-hardware/files/spacewars-hardware.sh yocto/meta-spacewars/recipes-spacewars/spacewars/files/spacewars-fast-update.sh
      - name: Report sandbox configuration and kernel denials
        if: failure()
        run: |
          uname -a
          id
          bwrap --version || true
          sysctl kernel.apparmor_restrict_unprivileged_userns \
            kernel.apparmor_restrict_unprivileged_unconfined \
            kernel.unprivileged_userns_clone user.max_user_namespaces || true
          sudo aa-status || true
          sudo journalctl --kernel --since '-5 minutes' --no-pager \
            --grep='apparmor|bwrap|userns' || true

  nes-core:
    name: NES core, golden tests, and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p engine-nes -p scenario-falling -p scenario-nes --all-targets
      - run: cargo clippy --locked -p engine-nes -p scenario-falling -p scenario-nes --all-targets --no-deps -- -D warnings
      - name: Exercise bundled-ROM release benchmark
        run: cargo run --locked --release -p scenario-falling --bin falling-benchmark -- 120 10

  linux-workspace:
    name: Linux workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install native client dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libdrm-dev libinput-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0 xauth xvfb
      - run: cargo test --locked --workspace --all-targets
      - name: Run black-box UI functional tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo test --locked -p engine-client --test ui_control_functional -- --ignored --test-threads=1
      - name: Upload functional-test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-functional-test-artifacts
          path: target/functional-test-artifacts
          if-no-files-found: ignore
      - name: Test vendored LinuxKMS input and software rendering
        run: cargo test --locked --manifest-path vendor/i-slint-backend-linuxkms/Cargo.toml --features renderer-software --lib

  spacewars-ai-regression:
    name: Spacewars AI deterministic baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Verify navigation-v1 baseline
        run: cargo run --locked --release -p engine-agent -- --suite navigation-v1 --verify
      - name: Verify strategy-v1 baseline
        run: cargo run --locked --release -p engine-agent -- --suite strategy-v1 --verify

  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo test --locked -p engine-nes -p scenario-falling -p scenario-nes --all-targets
      - run: cargo check --locked -p engine-client --all-targets

  aarch64-core:
    name: AArch64 core and scenario
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install AArch64 linker
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - run: cargo check --locked -p engine-nes -p scenario-falling -p scenario-nes --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
