name: Comprehensive nightly

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after every check passes (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Reuse every PR check, expanding UI coverage and enabling the long sweeps.
  # github.sha is immutable for this run; no job resolves a moving main branch.
  validation:
    name: Full validation
    uses: ./.github/workflows/ci.yml
    with:
      source: ${{ github.sha }}
      full: true

  publish:
    name: Publish rolling Windows nightly
    needs: validation
    if: ${{ needs.validation.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: windows-nightly-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validation.outputs.windows-artifact }}
          path: ${{ runner.temp }}/nightly-evidence
          merge-multiple: true
      - name: Publish validated ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.validation.result }}
        run: >-
          python3 .github/ci/publish_nightly.py
          --directory "$RUNNER_TEMP/nightly-evidence"
          --source "$RELEASE_SHA" --build-result "$BUILD_RESULT"
