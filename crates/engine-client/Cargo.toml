[package]
name = "engine-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "engine-client"
path = "src/main.rs"

[dependencies]
engine-common = { workspace = true }
engine-core = { workspace = true }
scenario-null = { workspace = true }
scenario-pizza = { workspace = true }
scenario-rover-lab = { workspace = true }
scenario-spacewars = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
gilrs = { workspace = true }
png = { workspace = true }
slint = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[features]
default = ["desktop"]
desktop = [
    "slint/accessibility",
    "slint/backend-winit",
    "slint/compat-1-2",
    "slint/renderer-femtovg",
    "slint/renderer-software",
    "slint/unstable-winit-030",
]
pi-kiosk = [
    "slint/backend-linuxkms",
    "slint/compat-1-2",
    "slint/software-renderer-systemfonts",
    # Retain desktop keyboard compatibility; native pad input uses evdev through
    # gilrs and does not depend on the display backend.
    "slint/unstable-winit-030",
]
