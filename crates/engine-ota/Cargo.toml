[package]
name = "engine-ota"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
publisher = ["dep:aws-lc-rs"]
# Separately built root-operator diagnostics; never enabled by the device image.
recovery-qualification = []

[[example]]
name = "recovery_qualify"
required-features = ["recovery-qualification"]

[[example]]
name = "feed_sign"
required-features = ["publisher"]

[[example]]
name = "image_candidate"
required-features = ["publisher"]

[dependencies]
async-trait = "0.1"
aws-lc-rs = { version = "1", optional = true }
bytes = "1"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
olpc-cjson = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
tough = "=0.24.0"
url = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["ioctl"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tar = "=0.4.45"
xattr = "=1.6.1"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
aws-lc-rs = "1"
tokio-rustls = "=0.26.6"
