[workspace]
resolver = "3"
members = [
    "crates/engine-common",
    "crates/engine-core",
    "crates/engine-gravity",
    "crates/engine-nes",
    "crates/engine-rapier",
    "crates/spacewars-ai",
    "crates/engine-client",
    "crates/spacewars-control",
    "crates/spacewars-cli",
    "crates/engine-agent",
    "crates/engine-os-manager",
    "scenarios/clock",
    "scenarios/falling",
    "scenarios/nes",
    "scenarios/null",
    "scenarios/pizza",
    "scenarios/rover-lab",
    "scenarios/spacewars",
]
exclude = [
    "vendor/i-slint-backend-linuxkms",
    "vendor/i-slint-core",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/aortez/space-wars"
rust-version = "1.89"

[workspace.dependencies]
# External.
bincode = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
directories = "6"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
rand = { version = "0.9", features = ["std_rng"] }
png = "0.17"
rapier2d = { version = "0.34", default-features = false, features = [
    "dim2",
    "enhanced-determinism",
    "f32",
    "profiler",
    "serde-serialize",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.13.1", default-features = false }
slint-build = { version = "=1.13.1" }
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal.
engine-common = { path = "crates/engine-common" }
engine-core = { path = "crates/engine-core" }
engine-gravity = { path = "crates/engine-gravity" }
engine-nes = { path = "crates/engine-nes" }
engine-rapier = { path = "crates/engine-rapier" }
spacewars-ai = { path = "crates/spacewars-ai" }
spacewars-control = { path = "crates/spacewars-control" }
scenario-clock = { path = "scenarios/clock" }
scenario-falling = { path = "scenarios/falling" }
scenario-nes = { path = "scenarios/nes" }
scenario-null = { path = "scenarios/null" }
scenario-pizza = { path = "scenarios/pizza" }
scenario-rover-lab = { path = "scenarios/rover-lab" }
scenario-spacewars = { path = "scenarios/spacewars" }

[patch.crates-io]
# Slint 1.13's software snapshot path reuses the display rotation and panics for
# non-square windows rotated by 90 or 270 degrees. Its system-font path also
# remaps font files for every metrics and shaping operation; retain owned face
# data for the lifetime of each cached font. Keep these patches local until an
# upstream release provides both fixes.
i-slint-core = { path = "vendor/i-slint-core" }
# LinuxKMS rotates rendered output but leaves absolute libinput coordinates in
# panel orientation. Apply the inverse output rotation before dispatching them.
i-slint-backend-linuxkms = { path = "vendor/i-slint-backend-linuxkms" }

[profile.release]
# Cross-crate inlining materially improves the tightly interleaved NES
# CPU/PPU/APU scheduler on the Raspberry Pi 5.
lto = "fat"
codegen-units = 1
