[package]
edition = "2021"
rust-version = "1.85"
name = "femtovg"
version = "0.17.0"
authors = [
    "Peter Todorov <ptodorov@cytec.bg>",
    "Adam Nemecek <adamnemecek@gmail.com>",
]
build = false
exclude = [
    "assets",
    "examples",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Antialiased 2D vector drawing library"
readme = "README.md"
keywords = [
    "graphics",
    "canvas",
    "vector",
    "drawing",
    "gpu",
]
categories = ["graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/femtovg/femtovg"

[package.metadata.docs.rs]
all-features = true
features = ["glutin/egl"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
cpu-glyph-cache = ["dep:ab_glyph_rasterizer"]
render-diagnostics = []
debug_inspector = []
default = ["image-loading"]
image-loading = ["image"]
wgpu = ["dep:wgpu"]

[lib]
name = "femtovg"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.ab_glyph_rasterizer]
version = "=0.1.10"
optional = true

[dependencies.bytemuck]
version = "1.16"
features = ["derive"]

[dependencies.fnv]
version = "1.0.7"

[dependencies.glow]
version = "0.16.0"
default-features = false

[dependencies.image]
version = "0.25.0"
optional = true
default-features = false

[dependencies.imgref]
version = "1.11.0"

[dependencies.log]
version = "0.4"

[dependencies.lru]
version = "0.16.0"
default-features = false

[dependencies.rgb]
version = "0.8.50"

[dependencies.rustybuzz]
version = "0.20.0"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]
optional = true

[dependencies.slotmap]
version = "1.0.7"

[dependencies.unicode-bidi]
version = "0.3.17"

[dependencies.unicode-segmentation]
version = "1.12.0"

[dependencies.wgpu]
version = "26"
features = ["wgsl"]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.glutin]
version = "0.31"
optional = true
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web_sys]
version = "0.3"
features = [
    "WebGlContextAttributes",
    "HtmlImageElement",
    "WebGl2RenderingContext",
]
package = "web-sys"

[profile.release]
debug = 2
