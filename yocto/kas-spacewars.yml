# KAS configuration for the Space-Wars Raspberry Pi kiosk image.
#
# Usage:
#   cd yocto
#   kas build kas-spacewars.yml

header:
  version: 14

distro: poky
machine: raspberrypi5

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: scarthgap

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: scarthgap
    layers:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-python:

  meta-rust-bin:
    url: "https://github.com/rust-embedded/meta-rust-bin.git"
    branch: master

  meta-pi-base:
    url: "https://github.com/aortez/sparkle-duck-shared.git"
    branch: main
    layers:
      yocto/meta-pi-base:

  meta-spacewars:
    path: meta-spacewars

local_conf_header:
  base: |
    #
    # WARNING: This file is generated by KAS from kas-spacewars.yml.
    # Edit kas-spacewars.yml, not build/conf/local.conf.
    #

    LICENSE_FLAGS_ACCEPTED = "commercial synaptics-killswitch"

    INIT_MANAGER = "systemd"
    PACKAGECONFIG:append:pn-systemd = " coredump"
    hostname:pn-base-files = "spacewars"
    DEFAULT_TIMEZONE = "America/Los_Angeles"

    IMAGE_FSTYPES = "wic.gz wic.bmap ext4.gz"
    WKS_FILE = "sdimage-ab.wks.in"

    # USB boot target.
    BOOT_DEVICE = "sda"
    CMDLINE_ROOT_PARTITION = "/dev/sda2"

    BOOT_SIZE = "150"
    ROOTFS_SIZE = "3072"
    DATA_SIZE = "1024"

    # Persistent /data project directory consumed by the Space-Wars services.
    PERSISTENT_DATA_APP_DIR = "spacewars"
    PERSISTENT_DATA_APP_USER = "spacewars"
    PERSISTENT_DATA_APP_GROUP = "spacewars"

    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j 8"

    BB_ENV_PASSTHROUGH_ADDITIONS:append = " SPACEWARS_CACHE_ROOT"
    SPACEWARS_CACHE_ROOT = "${@os.getenv('SPACEWARS_CACHE_ROOT', '/home/data/linux1/yocto-cache' if os.path.isdir('/home/data/linux1') else '/home/data/workspace/yocto-cache')}"
    DL_DIR ?= "${SPACEWARS_CACHE_ROOT}/downloads"
    SSTATE_DIR ?= "${SPACEWARS_CACHE_ROOT}/sstate-cache"

    INHERIT += "ccache"
    CCACHE_DIR ?= "${SPACEWARS_CACHE_ROOT}/.ccache/spacewars-yocto"
    CCACHE_MAXSIZE ?= "20G"
    PSEUDO_IGNORE_PATHS:append = ":${CCACHE_DIR}"

    INHERIT += "rm_work"
    INHERIT:remove = "create-spdx"

    # Match the repo's current local Rust toolchain closely enough for locked
    # dependency builds while using meta-rust-bin's prebuilt cross toolchain.
    PREFERRED_VERSION_rust-bin-cross-aarch64 = "1.94.0"
    PREFERRED_VERSION_cargo-bin-cross-aarch64 = "1.94.0"

  rpi: |
    DISABLE_SPLASH = "1"
    CMDLINE:append = " console=tty1 fbcon=map:01"

    # Include the HyperPixel overlay in the boot partition. The stock
    # raspberrypi5 machine does not deploy this overlay by default.
    RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/vc4-kms-dpi-hyperpixel4.dtbo"

    # Use the same Pi5 HyperPixel KMS setup as DirtSim. Slint's linuxkms backend
    # will choose the DRM device at runtime.
    RPI_EXTRA_CONFIG = '\n\
    # Pi5 - HyperPixel 4.0 DPI display\n\
    [pi5]\n\
    dtoverlay=vc4-kms-v3d-pi5\n\
    dtoverlay=vc4-kms-dpi-hyperpixel4\n\
    \n\
    # Common settings\n\
    [all]\n\
    hdmi_force_hotplug=1\n\
    '

target: spacewars-image
