# KAS configuration for the Space-Wars Raspberry Pi kiosk image.
#
# Usage:
#   cd yocto
#   kas build kas-spacewars.yml

header:
  version: 14

distro: poky
machine: raspberrypi-spacewars

# The candidate builder supplies its cache explicitly. Keep the existing local
# default when this variable is absent; never encode host cache paths in images.
env:
  SPACEWARS_CACHE_ROOT:
  SPACEWARS_OTA_BUILD_INPUTS:
  SPACEWARS_OTA_BUILD_INPUTS_SHA256:

repos:
  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: scarthgap
    commit: 4fb7016a07507683359ebd620f1951fd5ea44bfa
    layers:
      meta:
      meta-poky:

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: scarthgap
    commit: 018d44467c4f09eb63f8ea5e86e85d755250cf89

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: scarthgap
    commit: 0f00f8b9a21950640da8c5707343e5540133f86e
    layers:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-python:

  meta-rust-bin:
    url: "https://github.com/rust-embedded/meta-rust-bin.git"
    branch: master
    commit: eaea247f32f247ab525112d2fbc16e16a553d880

  meta-pi-base:
    url: "https://github.com/aortez/sparkle-duck-shared.git"
    branch: main
    commit: ce48602dfefd4ee7f3d3010086e685ede3fb17b9
    layers:
      yocto/meta-pi-base:

  meta-spacewars:
    path: meta-spacewars

local_conf_header:
  base: |
    #
    # WARNING: This file is generated by KAS from kas-spacewars.yml.
    # Edit kas-spacewars.yml, not build/conf/local.conf.
    #

    LICENSE_FLAGS_ACCEPTED = "commercial synaptics-killswitch"

    INIT_MANAGER = "systemd"
    PACKAGECONFIG:append:pn-systemd = " coredump"
    hostname:pn-base-files = "spacewars"
    DEFAULT_TIMEZONE = "America/Los_Angeles"

    IMAGE_FSTYPES = "wic.gz wic.bmap ext4.gz"
    WKS_FILE = "sdimage-ab.wks.in"

    # USB boot target.
    BOOT_DEVICE = "sda"
    CMDLINE_ROOT_PARTITION = "/dev/sda2"

    BOOT_SIZE = "150"
    ROOTFS_SIZE = "3072"
    DATA_SIZE = "1024"

    # Persistent /data project directory consumed by the Space-Wars services.
    PERSISTENT_DATA_APP_DIR = "spacewars"
    PERSISTENT_DATA_APP_USER = "spacewars"
    PERSISTENT_DATA_APP_GROUP = "spacewars"

    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j 8"

    # Leave enough room for running tasks to finish and for other checkouts.
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},20G,200K HALT,${TMPDIR},10G,100K WARN,${TMPDIR},25G,300K"
    BB_DISKMON_WARNINTERVAL = "1G,50K"

    BB_ENV_PASSTHROUGH_ADDITIONS:append = " SPACEWARS_CACHE_ROOT"
    SPACEWARS_CACHE_ROOT = "${@os.getenv('SPACEWARS_CACHE_ROOT', '/home/data/linux1/yocto-cache' if os.path.isdir('/home/data/linux1') else '/home/data/workspace/yocto-cache')}"
    DL_DIR ?= "${SPACEWARS_CACHE_ROOT}/downloads"
    SSTATE_DIR ?= "${SPACEWARS_CACHE_ROOT}/sstate-cache"

    INHERIT += "ccache"
    CCACHE_DIR ?= "${SPACEWARS_CACHE_ROOT}/.ccache/spacewars-yocto"
    CCACHE_MAXSIZE ?= "20G"
    PSEUDO_IGNORE_PATHS:append = ":${CCACHE_DIR}"

    INHERIT += "rm_work"
    INHERIT:remove = "create-spdx"

    # Match the repo's current local Rust toolchain closely enough for locked
    # dependency builds while using meta-rust-bin's prebuilt cross toolchain.
    PREFERRED_VERSION_rust-bin-cross-aarch64 = "1.94.0"
    PREFERRED_VERSION_cargo-bin-cross-aarch64 = "1.94.0"

  graphics: |
    SPACEWARS_GPU = "1"
    DISTRO_FEATURES:append = " opengl"
    PREFERRED_PROVIDER_virtual/egl = "mesa"
    PREFERRED_PROVIDER_virtual/libgles2 = "mesa"
    PREFERRED_PROVIDER_virtual/libgbm = "mesa"
    PREFERRED_VERSION_mesa = "25.1.6"
    # Direct KMS/GBM, no compositor. meta-raspberrypi supplies VC4/V3D.
    PACKAGECONFIG:pn-mesa = "gallium opengl egl gles gbm"

  rpi: |
    DISABLE_SPLASH = "1"
    CMDLINE:append = " console=tty1 fbcon=map:01 roottimeout=30"

    # The firmware selects the board's KMS driver. A separate file selects
    # cabinet/display hardware, and is preserved by rootfs-only A/B updates.
    RPI_EXTRA_CONFIG = '\n\
    [pi4]\n\
    dtoverlay=vc4-kms-v3d-pi4\n\
    [pi5]\n\
    dtoverlay=vc4-kms-v3d-pi5\n\
    [all]\n\
    arm_64bit=1\n\
    initramfs spacewars-recovery.cpio.gz followkernel\n\
    include spacewars-device.txt\n\
    [all]\n\
    '

target: spacewars-image
