#@TYPE: Machine
#@NAME: Space-Wars Raspberry Pi 4/5 (64-bit)
#@DESCRIPTION: One USB-boot image; display/HAT selection is per device, not per CPU.

# Use the Pi 4's instruction set and common 4 KiB-page kernel on both boards.
# The Pi 5-only Cortex-A76 tune and bcm2712_defconfig are not Pi 4 compatible.
MACHINEOVERRIDES =. "raspberrypi4:"
require conf/machine/include/arm/armv8a/tune-cortexa72.inc
include conf/machine/include/rpi-base.inc

MACHINE_FEATURES += "pci"
MACHINE_EXTRA_RRECOMMENDS += " \
    linux-firmware-rpidistro-bcm43455 \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
    linux-firmware-rpidistro-bcm43456 \
    bluez-firmware-rpidistro-bcm4345c5-hcd \
"

RPI_KERNEL_DEVICETREE = " \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2712-rpi-5-b.dtb \
"
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/vc4-kms-dpi-hyperpixel4.dtbo"

SDIMG_KERNELIMAGE = "kernel8.img"
KERNEL_IMAGETYPE_DIRECT = "Image"
KERNEL_IMAGETYPE_UBOOT = "Image"
KERNEL_BOOTCMD = "booti"
UBOOT_MACHINE = "rpi_arm64_config"
SERIAL_CONSOLES = "115200;ttyS0 115200;ttyAMA10"
VC4DTBO = "vc4-kms-v3d"

# Both boot filenames contain the SAME common kernel (as in DirtSim's image).
IMAGE_BOOT_FILES:append = " \
    ${KERNEL_IMAGETYPE};kernel_2712.img \
    picade.dtbo;overlays/picade.dtbo \
    spacewars-device.txt \
    spacewars-profiles/*;spacewars-profiles/ \
    spacewars-boot-id \
"
do_image_wic[depends] += "picade-hat:do_deploy spacewars-hardware:do_deploy"
