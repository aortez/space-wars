[Journal]
Storage=persistent
Compress=yes
# One system journal, including application logs, and one budget across slots.
SplitMode=none
SystemMaxUse=128M
SystemKeepFree=256M
SystemMaxFileSize=8M
SystemMaxFiles=32
RuntimeMaxUse=16M
RuntimeKeepFree=16M
RuntimeMaxFileSize=2M
RuntimeMaxFiles=16
MaxRetentionSec=14day
MaxFileSec=1day
# Bound the ordinary unsynced tail if a watchdog or power loss resets the board.
SyncIntervalSec=30s
