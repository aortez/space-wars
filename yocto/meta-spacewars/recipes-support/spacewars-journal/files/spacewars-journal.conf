[Journal]
Storage=persistent
Compress=yes
# One system journal, including application logs, and one budget across slots.
SplitMode=none
SystemMaxUse=128M
SystemKeepFree=256M
SystemMaxFileSize=8M
SystemMaxFiles=32
RuntimeMaxUse=16M
RuntimeKeepFree=16M
RuntimeMaxFileSize=2M
RuntimeMaxFiles=16
# Each boot starts at the image's build-time clock until timesyncd or NTP sets
# it. Time-based rotation archives the boot's first file at that clock step,
# and time-based retention then deletes it by its old start time, so only the
# size and file-count limits above apply.
MaxRetentionSec=0
MaxFileSec=0
# Bound the ordinary unsynced tail if a watchdog or power loss resets the board.
SyncIntervalSec=30s
