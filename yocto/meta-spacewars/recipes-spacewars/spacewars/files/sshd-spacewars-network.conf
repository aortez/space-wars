[Unit]
# Wants preserves recovery SSH if the independent service cannot start.
# The helper checks saved radio uncertainty before using its offline fallback.
Wants=spacewars-system.service
After=spacewars-system.service

[Service]
ExecStartPre=/usr/bin/engine-os-manager ssh-network-admit
# stdin/stdout are the client connection for sshd -i. Without this, stderr is
# too, and helper errors would reach the unauthenticated client.
StandardError=journal
TimeoutStartSec=60s
